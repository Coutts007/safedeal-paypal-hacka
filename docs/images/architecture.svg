<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <title>SafeDeal architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.2; }
      .user { fill: #ffffff; stroke: #64748b; stroke-width: 1.2; }
      .ai { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.4; }
      .money { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
      .ext { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }
      .group { fill: none; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .line { fill: none; stroke: #475569; stroke-width: 1.4; marker-end: url(#a); }
      .t { text-anchor: middle; fill: #0f172a; }
      .b { font-weight: bold; }
      .s { font-size: 12.5px; fill: #334155; }
      .lbl { font-size: 12px; fill: #334155; }
      .g { font-size: 13px; fill: #64748b; font-weight: bold; }
    </style>
  </defs>
  <rect width="1200" height="740" fill="#ffffff"/>

  <!-- People -->
  <rect class="user" x="110" y="24" width="220" height="56" rx="8"/>
  <text class="t b" x="220" y="47">Seller</text>
  <text class="t s" x="220" y="66">private link or Log in with PayPal</text>
  <rect class="user" x="350" y="24" width="220" height="56" rx="8"/>
  <text class="t b" x="460" y="47">Buyer</text>
  <text class="t s" x="460" y="66">private link, no account</text>
  <rect class="user" x="590" y="24" width="220" height="56" rx="8"/>
  <text class="t b" x="700" y="47">Reviewer</text>
  <text class="t s" x="700" y="66">/admin, password</text>

  <!-- Render -->
  <rect class="group" x="40" y="110" width="1120" height="482" rx="12"/>
  <text class="g" x="56" y="132">Render</text>
  <rect class="group" x="60" y="142" width="810" height="312" rx="10"/>
  <text class="g" x="76" y="164">Next.js web service</text>

  <rect class="box" x="340" y="160" width="240" height="56" rx="8"/>
  <text class="t b" x="460" y="183">Pages</text>
  <text class="t s" x="460" y="202">deal pages · dashboard · review</text>

  <rect class="box" x="340" y="250" width="240" height="56" rx="8"/>
  <text class="t b" x="460" y="273">API routes</text>
  <text class="t s" x="460" y="292">every body checked with Zod</text>

  <rect class="ai" x="80" y="350" width="230" height="80" rx="8"/>
  <text class="t b" x="195" y="376">lib/ai</text>
  <text class="t s" x="195" y="396">reads chats and evidence</text>
  <text class="t s" x="195" y="414">only proposes, never pays</text>

  <rect class="money" x="340" y="350" width="240" height="80" rx="8"/>
  <text class="t b" x="460" y="376">lib/rules/engine.ts</text>
  <text class="t s" x="460" y="396">the only code that can</text>
  <text class="t s" x="460" y="414">authorise, capture or void</text>

  <rect class="box" x="620" y="350" width="230" height="80" rx="8"/>
  <text class="t b" x="735" y="376">Webhook receivers</text>
  <text class="t s" x="735" y="396">signature checked</text>
  <text class="t s" x="735" y="414">each event id used once</text>

  <rect class="box" x="900" y="250" width="240" height="56" rx="8"/>
  <text class="t b" x="1020" y="273">Cron job</text>
  <text class="t s" x="1020" y="292">deadline sweep every 10 min</text>

  <path class="box" d="M340,486 a120,12 0 0 1 240,0 v76 a120,12 0 0 1 -240,0 z"/>
  <path d="M340,486 a120,12 0 0 0 240,0" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <text class="t b" x="460" y="521">Postgres</text>
  <text class="t s" x="460" y="540">deals, terms versions, evidence,</text>
  <text class="t s" x="460" y="557">hash-chained audit log</text>

  <!-- Outside services -->
  <rect class="ext" x="80" y="630" width="230" height="70" rx="8"/>
  <text class="t b" x="195" y="658">Anthropic Claude</text>
  <text class="t s" x="195" y="678">Sonnet 5.5</text>
  <rect class="ext" x="620" y="630" width="230" height="70" rx="8"/>
  <text class="t b" x="735" y="655">PayPal sandbox</text>
  <text class="t s" x="735" y="674">Orders v2 · Payments v2 · JS SDK v6</text>
  <text class="t s" x="735" y="691">Log in with PayPal · webhooks</text>
  <rect class="ext" x="900" y="630" width="240" height="70" rx="8"/>
  <text class="t b" x="1020" y="658">Courier</text>
  <text class="t s" x="1020" y="678">test courier / AfterShip</text>

  <!-- Arrows -->
  <path class="line" d="M220,80 V120 H400 V158"/>
  <path class="line" d="M460,80 V158"/>
  <path class="line" d="M700,80 V120 H520 V158"/>
  <path class="line" d="M460,216 V248"/>

  <path class="line" d="M340,270 H170 V348"/>
  <path class="line" d="M220,350 V292 H338"/>
  <text class="lbl" x="178" y="262">chat, evidence</text>
  <text class="lbl" x="228" y="318">proposal</text>
  <text class="lbl" x="228" y="333">(schema-checked)</text>

  <path class="line" d="M460,306 V348"/>
  <text class="lbl" x="452" y="331" text-anchor="end">terms, actions</text>

  <path class="line" d="M1020,306 V330 H560 V348"/>
  <text class="lbl" x="800" y="324">deadlines passed</text>

  <path class="line" d="M620,390 H582"/>
  <text class="lbl" x="600" y="447" text-anchor="middle">verified events</text>

  <path class="line" d="M195,430 V628" marker-start="url(#a)"/>

  <path class="line" d="M400,430 V484"/>
  <text class="lbl" x="392" y="472" text-anchor="end">state + audit, one transaction</text>

  <path class="line" d="M530,430 V470 H680 V628"/>
  <text class="lbl" x="672" y="606" text-anchor="end">authorise · capture · void</text>
  <text class="lbl" x="672" y="622" text-anchor="end">fixed PayPal-Request-Id</text>

  <path class="line" d="M800,630 V432"/>
  <text class="lbl" x="808" y="616">webhooks</text>

  <path class="line" d="M1020,630 V410 H852"/>
  <text class="lbl" x="1028" y="520">signed "delivered"</text>
  <text class="lbl" x="1028" y="536">event</text>
</svg>
