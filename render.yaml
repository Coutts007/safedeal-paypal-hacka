# Render Blueprint for SafeDeal (BUILD_PLAN section 5): one web service, one Postgres database and
# one cron job that runs the sweep every 10 minutes. Sandbox only.
#
# Secrets are never written here. Keys marked `sync: false` are asked for in the Render Dashboard
# when the Blueprint is created; `generateValue` keys are generated by Render.
# Region: frankfurt is the closest Render region to Nairobi.
#
# Plans (Peter, 2026-10-22): free web and database now, upgraded to paid by 9 November.
# - web free: spins down after 15 minutes without traffic; the 10-minute cron keeps it awake.
#   Pre-deploy commands need a paid plan, so migrations run in the start command instead.
# - database free: expires 30 days after creation (about 21 November), so it MUST be upgraded in
#   the Dashboard (same database, data kept) by 9 November. Upgrade target: basic-256mb.
# - web upgrade target: starter (always on). The migrate-then-start command works on both.
# - cron 0.5c-512mb (starter): no free plan for cron jobs; billed per second, $1 monthly minimum.

databases:
  - name: safedeal-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"
    databaseName: safedeal
    user: safedeal

services:
  - type: web
    name: safedeal
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate:deploy && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: safedeal-db
          property: connectionString
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: NEXT_PUBLIC_PAYPAL_SDK_URL
        value: https://www.sandbox.paypal.com/web-sdk/v6/core
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # NEXT_PUBLIC_ values are read at build time: redeploy after changing it.
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      # Set after creating the PayPal webhook for <APP_BASE_URL>/api/webhooks/paypal.
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # The service's own https URL (no trailing slash). Not a secret, so it lives here: links and
      # the cron job both use it, and a Dashboard copy is easy to leave at localhost.
      - key: APP_BASE_URL
        value: https://safedeal-4abv.onrender.com
      - key: SANDBOX_SELLER_A_EMAIL
        sync: false
      - key: SANDBOX_SELLER_B_EMAIL
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-sonnet-5-5
      - key: LLM_API_KEY
        sync: false
      - key: COURIER_MODE
        value: test
      - key: TEST_COURIER_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      # Derives each deal's handover code. Changing it changes the codes of deals in progress.
      - key: HANDOVER_SECRET
        generateValue: true
      # 1 = real time. For the Gate 2 test use e.g. 1440 (a day becomes a minute).
      - key: DEMO_TIME_SCALE
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: KES_PER_USD
        value: "130"
      - key: MAX_DEAL_USD
        value: "500"

  - type: cron
    name: safedeal-sweep
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "*/10 * * * *"
    buildCommand: echo "no build needed"
    startCommand: node scripts/cron-sweep.mjs
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Same value as the web service. Written out, not copied with fromService: a copy is taken
      # once and does not follow later Dashboard changes.
      - key: APP_BASE_URL
        value: https://safedeal-4abv.onrender.com
      - key: CRON_SECRET
        fromService:
          type: web
          name: safedeal
          envVarKey: CRON_SECRET
