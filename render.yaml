# Render Blueprint for SafeDeal (BUILD_PLAN section 5): one web service, one Postgres database and
# one cron job that runs the sweep every 10 minutes. Sandbox only.
#
# Secrets are never written here. Keys marked `sync: false` are asked for in the Render Dashboard
# when the Blueprint is created; `generateValue` keys are generated by Render.
# Region: frankfurt is the closest Render region to Nairobi.
#
# Plans (Peter to confirm the cost before creating):
# - web 0.5c-512mb (legacy "starter"): always on, so PayPal webhooks and judges never wait for a
#   free instance to spin up.
# - database 0.1c-256mb (legacy "basic-256mb"): free databases expire after 30 days, before judging
#   ends (1 to 15 December).
# - cron 0.5c-512mb: billed per second of run time, with a $1 monthly minimum.

databases:
  - name: safedeal-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: safedeal
    user: safedeal

services:
  - type: web
    name: safedeal
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: safedeal-db
          property: connectionString
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: NEXT_PUBLIC_PAYPAL_SDK_URL
        value: https://www.sandbox.paypal.com/web-sdk/v6/core
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # NEXT_PUBLIC_ values are read at build time: redeploy after changing it.
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      # Set after creating the PayPal webhook for <APP_BASE_URL>/api/webhooks/paypal.
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # The service's own https URL, e.g. https://safedeal.onrender.com (no trailing slash).
      - key: APP_BASE_URL
        sync: false
      - key: SANDBOX_SELLER_A_EMAIL
        sync: false
      - key: SANDBOX_SELLER_B_EMAIL
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-sonnet-5-5
      - key: LLM_API_KEY
        sync: false
      - key: COURIER_MODE
        value: test
      - key: TEST_COURIER_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      # 1 = real time. For the Gate 2 test use e.g. 1440 (a day becomes a minute).
      - key: DEMO_TIME_SCALE
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: KES_PER_USD
        value: "130"
      - key: MAX_DEAL_USD
        value: "500"

  - type: cron
    name: safedeal-sweep
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "*/10 * * * *"
    buildCommand: echo "no build needed"
    startCommand: node scripts/cron-sweep.mjs
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_BASE_URL
        fromService:
          type: web
          name: safedeal
          envVarKey: APP_BASE_URL
      - key: CRON_SECRET
        fromService:
          type: web
          name: safedeal
          envVarKey: CRON_SECRET
